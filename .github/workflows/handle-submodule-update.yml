name: Process Submodule Update

on:
  repository_dispatch:
    types: [submodule_update]

jobs:
  update-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          token: ${{ secrets.PARENT_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Submodule Hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update the specific submodule to the SHA sent in the payload
          git update-index --cacheinfo 160000,${{ github.event.client_payload.sha }},${{ github.event.client_payload.submodule }}
      
      - name: Create fragment
        id: updater
        run: |
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          python scripts/update_inventory.py payload.json       

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PARENT_REPO_PAT }}
          commit-message: "Add staging fragment for ${{ github.event.client_payload.submodule }} at ${{ github.event.client_payload.sha }}"
          title: "Staging: ${{ github.event.client_payload.submodule }}"
          branch: "auto-sync-${{ github.event.client_payload.submodule }}"
          add-paths: |
            staging/*.json
          body: |
            Updated submodule pointer to latest SHA.
            New transform metadata has been staged in the `staging/` directory.
            
            **Inventory Changes:**
            ${{ steps.updater.outputs.changelog || 'None (Pointer update only)' }}