name: Process Submodule Update

on:
  repository_dispatch:
    types: [submodule_update]

jobs:
  update-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.PARENT_REPO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Submodule Hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Update the specific submodule to the SHA sent in the payload
          git update-index --cacheinfo 160000,${{ github.event.client_payload.sha }},${{ github.event.client_payload.submodule }}
      
      - name: Log Payload (Debug) REMOVE
        run: |
          echo "Received dispatch from ${{ github.event.client_payload.submodule }}"
          echo "Payload: ${{ toJson(github.event.client_payload) }}"
    
      - name: Update transforms.json
        id: updater
        run: |
          # 1. Save the payload to a temporary file to avoid shell quoting errors
          echo '${{ toJson(github.event.client_payload) }}' > payload.json
          
          # 2. Run the script pointing to that file
          python scripts/update_inventory.py payload.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PARENT_REPO_PAT }}
          commit-message: "Sync ${{ github.event.client_payload.submodule }} to ${{ github.event.client_payload.sha }}"
          title: "Auto-Sync: ${{ github.event.client_payload.submodule }}"
          branch: "auto-sync-${{ github.event.client_payload.submodule }}"
          body: |
            Updated submodule pointer to latest SHA.
            
            **Inventory Changes:**
            ${{ steps.updater.outputs.changelog || 'No new transforms detected.' }}
