name: Process Submodule Update

on:
  repository_dispatch:
    types: [submodule_update]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PARENT_REPO_PAT }}
          submodules: false 

      - name: Update Submodule Pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git update-index --cacheinfo 160000,${{ github.event.client_payload.sha }},${{ github.event.client_payload.submodule }}

      - name: Write Changelog Fragment
        run: |
          mkdir -p staging
          SUBMODULE="${{ github.event.client_payload.submodule }}"
          SHORT_SHA=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-7)
          MSG="${{ github.event.client_payload.commit_msg }}"
          
          # Write a clean, human-readable line to an isolated tracking file
          echo "- [$SUBMODULE@$SHORT_SHA]: $MSG" > "staging/log-${SUBMODULE}-${SHORT_SHA}.txt"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PARENT_REPO_PAT }}
          commit-message: "Sync ${{ github.event.client_payload.submodule }} and log history"
          title: "Sync: ${{ github.event.client_payload.submodule }}"
          branch: "sync-${{ github.event.client_payload.submodule }}"
          add-paths: |
            staging/*.txt
          body: |
            Automated submodule pointer sync.
             Staged changelog line:
            `${{ github.event.client_payload.commit_msg }}`